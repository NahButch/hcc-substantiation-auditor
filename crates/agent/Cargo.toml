[package]
name = "agent"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "LLM reasoning agent with verify-and-self-correct loop"

[lib]
name = "agent"
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
