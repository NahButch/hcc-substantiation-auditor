[package]
name = "eval"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Rust evaluation harness: metrics + eval-set tooling (ported from the Python hcceval)"

[lib]
name = "eval"
path = "src/lib.rs"

[[bin]]
name = "hcceval"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
agent = { path = "../agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
