<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 860 330" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The policy feedback circuit</title>
<desc>A loop: Policy directive translates to Solution, then Capture, then Measure, then Report, then Analyze and propose, which synthesizes back into a new Policy directive. Solution, Capture, Measure, and Report are built/demonstrated (teal); Policy directive and Analyze + propose are the broader vision (gray); the translation and synthesis transitions are the AI edges (purple).</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="430" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#57534e">The regulatory feedback circuit</text>

<!-- ===== nodes ===== -->
<!-- gray = vision -->
<rect x="30"  y="64"  width="150" height="56" rx="9" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="105" y="89"  text-anchor="middle" font-size="13.5" font-weight="600" fill="#57534e">Policy directive</text>
<text x="105" y="106" text-anchor="middle" font-size="11" fill="#78716c">HCC model + RADV rule</text>
<!-- teal = built -->
<rect x="270" y="64"  width="150" height="56" rx="9" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.4"/>
<text x="345" y="89"  text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f766e">Solution</text>
<text x="345" y="106" text-anchor="middle" font-size="11" fill="#0d9488">Engine + agent</text>
<rect x="470" y="64"  width="150" height="56" rx="9" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.4"/>
<text x="545" y="89"  text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f766e">Capture</text>
<text x="545" y="106" text-anchor="middle" font-size="11" fill="#0d9488">Flags &amp; divergences</text>
<rect x="670" y="64"  width="150" height="56" rx="9" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.4"/>
<text x="745" y="89"  text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f766e">Measure</text>
<text x="745" y="106" text-anchor="middle" font-size="11" fill="#0d9488">Eval harness</text>
<rect x="670" y="210" width="150" height="56" rx="9" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.4"/>
<text x="745" y="235" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f766e">Report</text>
<text x="745" y="252" text-anchor="middle" font-size="11" fill="#0d9488">Actionable findings</text>
<rect x="200" y="210" width="280" height="56" rx="9" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="340" y="235" text-anchor="middle" font-size="13.5" font-weight="600" fill="#57534e">Analyze + propose</text>
<text x="340" y="252" text-anchor="middle" font-size="11" fill="#78716c">Evidence → policy change</text>

<!-- ===== edges ===== -->
<!-- translation (AI edge, purple) — wide first gap to fit the label -->
<path d="M180 92 L270 92" fill="none" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="225" y="84" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7c3aed">Translation</text>
<!-- top chain (normal) -->
<path d="M420 92 L470 92" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M620 92 L670 92" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#ah)"/>
<!-- Measure -> Report (down) -->
<path d="M745 120 L745 210" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#ah)"/>
<!-- Report -> Analyze (left) -->
<path d="M670 238 L480 238" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#ah)"/>
<!-- synthesis return (AI edge, purple): Analyze -> left -> up -> Policy -->
<path d="M200 238 L105 238 L105 120" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="150" y="230" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7c3aed">Synthesis</text>
<text x="112" y="170" text-anchor="start" font-size="10" font-style="italic" fill="#a8a29e">(new directive)</text>

<!-- ===== legend ===== -->
<rect x="300" y="298" width="13" height="11" rx="2" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.2"/>
<text x="319" y="307" font-size="10.5" fill="#57534e">Built / demonstrated</text>
<rect x="460" y="298" width="13" height="11" rx="2" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="479" y="307" font-size="10.5" fill="#57534e">Vision / pointed toward</text>
<line x1="628" y1="304" x2="650" y2="304" stroke="#8b5cf6" stroke-width="1.8"/>
<text x="656" y="307" font-size="10.5" fill="#57534e">AI edge</text>
</svg>
