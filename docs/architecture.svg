<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 500" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>System architecture</title>
<desc>An orchestration layer (agent loop: plan, act, verify, self-correct, report) drives two components: an LLM reasoning layer (probabilistic) and a deterministic engine (verifiable oracle), which exchange tool calls. Both feed an offline evaluation harness. The LLM extracts diagnoses, judges documentation substantiation, and proposes flags with citations; the engine does ICD-10 to HCC mapping, risk-score calculation, pinned model-version logic, and returns ground truth.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#57534e">System architecture — LLM proposes, verified engine disposes</text>

<!-- Orchestration layer -->
<rect x="70" y="46" width="620" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="380" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#4338ca">ORCHESTRATION LAYER</text>
<text x="380" y="92" text-anchor="middle" font-size="11.5" fill="#6366f1">agent loop:  plan → act → verify → self-correct → report</text>

<!-- orchestration -> components -->
<path d="M210 108 L210 172" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M550 108 L550 172" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#ah)"/>

<!-- LLM reasoning (probabilistic) -->
<rect x="70" y="172" width="280" height="200" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="210" y="198" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6d28d9">LLM REASONING</text>
<text x="210" y="215" text-anchor="middle" font-size="11" font-style="italic" fill="#7c3aed">probabilistic</text>
<text x="90" y="247" font-size="11.5" fill="#6d28d9">• extract diagnoses from clinical text</text>
<text x="90" y="273" font-size="11.5" fill="#6d28d9">• judge documentation substantiation</text>
<text x="90" y="299" font-size="11.5" fill="#6d28d9">• propose flags + regulatory citation</text>
<text x="90" y="325" font-size="11.5" fill="#6d28d9">• then accept the engine's verdict</text>

<!-- Deterministic engine (verifiable oracle) -->
<rect x="410" y="172" width="280" height="200" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
<text x="550" y="198" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f766e">DETERMINISTIC ENGINE</text>
<text x="550" y="215" text-anchor="middle" font-size="11" font-style="italic" fill="#0d9488">verifiable oracle · source of truth</text>
<text x="430" y="247" font-size="11.5" fill="#0f766e">• ICD-10 → HCC mapping</text>
<text x="430" y="273" font-size="11.5" fill="#0f766e">• HCC → risk-score calculation</text>
<text x="430" y="299" font-size="11.5" fill="#0f766e">• model-version logic (pinned: V28)</text>
<text x="430" y="325" font-size="11.5" fill="#0f766e">• returns ground truth + provenance</text>

<!-- tool calls (bidirectional) -->
<path d="M350 268 L410 268" fill="none" stroke="#57534e" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="380" y="259" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">tool calls</text>

<!-- components -> eval (converging merge) -->
<path d="M210 372 L210 414 L380 414" fill="none" stroke="#78716c" stroke-width="1.6"/>
<path d="M550 372 L550 414 L380 414" fill="none" stroke="#78716c" stroke-width="1.6"/>
<path d="M380 414 L380 432" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#ah)"/>

<!-- Eval harness -->
<rect x="262" y="432" width="236" height="56" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="380" y="456" text-anchor="middle" font-size="13" font-weight="600" fill="#57534e">EVAL HARNESS</text>
<text x="380" y="473" text-anchor="middle" font-size="10.5" fill="#78716c">separate · offline · extraction + substantiation scored apart</text>
</svg>
