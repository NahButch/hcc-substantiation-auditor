<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 540" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The policy-to-auditor regulatory feedback circuit</title>
<desc>A seven-stage cyclical loop: a policy directive translates into an executable solution, which captures real-world data, measures it, reports findings, and analyzes them to propose policy changes that feed back to the directive. The solution, capture, measure, and report stages are highlighted as covered by this project; the policy and analyze-propose stages are shown grayed as the broader vision. AI sits on the translation and synthesis edges.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="340" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#57534e">The regulatory feedback circuit</text>

<!-- ===== flowing curved edges (drawn first, behind nodes) ===== -->
<g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<!-- Policy -> Solution (AI: translation) -->
<path d="M424 100 Q486 122 492 170" stroke="#1d9e75" marker-end="url(#arrow)"/>
<!-- Solution -> Capture -->
<path d="M565 226 Q592 263 565 300" stroke="#1d9e75" marker-end="url(#arrow)"/>
<!-- Capture -> Measure -->
<path d="M494 356 Q470 402 422 420" stroke="#1d9e75" marker-end="url(#arrow)"/>
<!-- Measure -> Report -->
<path d="M256 440 Q208 404 200 360" stroke="#1d9e75" marker-end="url(#arrow)"/>
<!-- Report -> Analyze -->
<path d="M115 300 Q88 263 115 228" stroke="#a8a29e" marker-end="url(#arrow)"/>
<!-- Analyze -> Policy (AI: synthesis) -->
<path d="M196 170 Q210 122 250 102" stroke="#a8a29e" marker-end="url(#arrow)"/>
</g>

<!-- ===== nodes ===== -->
<!-- Policy directive (top) -->
<rect x="250" y="44" width="180" height="56" rx="8" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="340" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#57534e">Policy directive</text>
<text x="340" y="86" text-anchor="middle" font-size="12" fill="#78716c">HCC model + RADV rule</text>
<!-- Solution (upper right) -->
<rect x="480" y="170" width="170" height="56" rx="8" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="565" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Solution</text>
<text x="565" y="212" text-anchor="middle" font-size="12" fill="#0f6e56">Auditor: engine + agent</text>
<!-- Capture (lower right) -->
<rect x="480" y="300" width="170" height="56" rx="8" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="565" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Capture</text>
<text x="565" y="342" text-anchor="middle" font-size="12" fill="#0f6e56">Real-world signal</text>
<!-- Measure (bottom) -->
<rect x="255" y="420" width="170" height="56" rx="8" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="340" y="444" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Measure</text>
<text x="340" y="462" text-anchor="middle" font-size="12" fill="#0f6e56">Eval harness metrics</text>
<!-- Report (lower left) -->
<rect x="30" y="300" width="170" height="56" rx="8" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="115" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Report</text>
<text x="115" y="342" text-anchor="middle" font-size="12" fill="#0f6e56">Findings + failure modes</text>
<!-- Analyze + propose (upper left) -->
<rect x="30" y="170" width="170" height="56" rx="8" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="115" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#57534e">Analyze + propose</text>
<text x="115" y="212" text-anchor="middle" font-size="12" fill="#78716c">Evidence to policy</text>

<!-- ===== AI edge pills (more vertical room now) ===== -->
<rect x="394" y="123" width="116" height="24" rx="12" fill="#e9e7fc" stroke="#534ab7" stroke-width="1"/>
<text x="452" y="139" text-anchor="middle" font-size="12" fill="#3c3489">AI: translation</text>
<rect x="170" y="123" width="116" height="24" rx="12" fill="#e9e7fc" stroke="#534ab7" stroke-width="1"/>
<text x="228" y="139" text-anchor="middle" font-size="12" fill="#3c3489">AI: synthesis</text>

<!-- ===== legend ===== -->
<rect x="40" y="500" width="14" height="14" rx="3" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="62" y="511" font-size="12" fill="#78716c">Covered by this project</text>
<rect x="250" y="500" width="14" height="14" rx="3" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="272" y="511" font-size="12" fill="#78716c">Broader vision (not built)</text>
<rect x="448" y="500" width="14" height="14" rx="3" fill="#e9e7fc" stroke="#534ab7" stroke-width="1"/>
<text x="470" y="511" font-size="12" fill="#78716c">Where AI connects</text>
</svg>
