<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 470" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The policy-to-auditor regulatory feedback circuit</title>
<desc>A seven-stage cyclical loop: a policy directive translates into an executable solution, which captures real-world data, measures it, reports findings, and analyzes them to propose policy changes that feed back to the directive. The solution, capture, measure, and report stages are highlighted as covered by this project; the policy and analyze-propose stages are shown grayed as the broader vision. AI sits on the translation and synthesis edges.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="340" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#57534e">The regulatory feedback circuit</text>

<rect x="250" y="48" width="180" height="56" rx="8" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="340" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#57534e">Policy directive</text>
<text x="340" y="90" text-anchor="middle" font-size="12" fill="#78716c">HCC model + RADV rule</text>

<rect x="470" y="150" width="170" height="56" rx="8" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="555" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Solution</text>
<text x="555" y="192" text-anchor="middle" font-size="12" fill="#0f6e56">Auditor: engine + agent</text>

<rect x="470" y="248" width="170" height="56" rx="8" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="555" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Capture</text>
<text x="555" y="290" text-anchor="middle" font-size="12" fill="#0f6e56">Real-world signal</text>

<rect x="255" y="346" width="170" height="56" rx="8" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="340" y="370" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Measure</text>
<text x="340" y="388" text-anchor="middle" font-size="12" fill="#0f6e56">Eval harness metrics</text>

<rect x="40" y="248" width="170" height="56" rx="8" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="125" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Report</text>
<text x="125" y="290" text-anchor="middle" font-size="12" fill="#0f6e56">Findings + failure modes</text>

<rect x="40" y="150" width="170" height="56" rx="8" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="125" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#57534e">Analyze + propose</text>
<text x="125" y="192" text-anchor="middle" font-size="12" fill="#78716c">Evidence to policy</text>

<line x1="430" y1="86" x2="500" y2="148" stroke="#1d9e75" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="555" y1="206" x2="555" y2="246" stroke="#1d9e75" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="500" y1="304" x2="425" y2="362" stroke="#1d9e75" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="255" y1="378" x2="195" y2="306" stroke="#1d9e75" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="125" y1="246" x2="125" y2="208" stroke="#a8a29e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="180" y1="148" x2="250" y2="92" stroke="#a8a29e" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="392" y="116" width="116" height="24" rx="12" fill="#e9e7fc" stroke="#534ab7" stroke-width="1"/>
<text x="450" y="132" text-anchor="middle" font-size="12" fill="#3c3489">AI: translation</text>
<rect x="172" y="116" width="116" height="24" rx="12" fill="#e9e7fc" stroke="#534ab7" stroke-width="1"/>
<text x="230" y="132" text-anchor="middle" font-size="12" fill="#3c3489">AI: synthesis</text>

<rect x="40" y="426" width="14" height="14" rx="3" fill="#d1f0e6" stroke="#0f6e56" stroke-width="1"/>
<text x="62" y="437" font-size="12" fill="#78716c">Covered by this project</text>
<rect x="250" y="426" width="14" height="14" rx="3" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="272" y="437" font-size="12" fill="#78716c">Broader vision (not built)</text>
<rect x="448" y="426" width="14" height="14" rx="3" fill="#e9e7fc" stroke="#534ab7" stroke-width="1"/>
<text x="470" y="437" font-size="12" fill="#78716c">Where AI connects</text>
</svg>
